services:
  mock-smartthings:
    build: .
    container_name: mock-smartthings
    ports:
      # 관리 프로그램이 8080 을 쓰므로 목은 8081.
      - "8081:8081"
    environment:
      # tick 한 번에 줄어드는 분. 크게 하면 사이클이 더 빨리 끝난다.
      - MOCK_MINUTES_PER_TICK=1
      - MOCK_TICK_MS=1000
      # 완료 상태를 몇 초 유지한 뒤 jobState 를 none 으로 되돌릴지
      - MOCK_FINISH_HOLD_SECONDS=30
      # 명령을 받고 상태에 반영되기까지의 지연(ms). 0 이면 즉시 반영.
      # 실기기와 비슷하게 하려면 2000~3000 정도를 준다.
      - MOCK_COMMAND_DELAY_MS=0
      # lenient | strict
      - MOCK_TOKEN_VALIDATION=lenient
      - MOCK_OAUTH_EXPIRES_IN=3600

  # 관리 프로그램(Washer-Backend-v2)도 같은 compose 로 띄운다면 아래처럼 붙인다.
  #
  # washer-backend:
  #   build: ../Washer-Backend-v2
  #   depends_on: [mock-smartthings]
