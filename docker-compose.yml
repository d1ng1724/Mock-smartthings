  #     - SMARTTHINGS_API_URL=http://mock-smartthings:8081
  #     - SMARTTHINGS_OAUTH_URL=http://mock-smartthings:8081/oauth/token
  #     - SMARTTHINGS_AUTHORIZE_URL=http://mock-smartthings:8081/oauth/authorize
  #     - SMARTTHINGS_CLIENT_ID=mock-client
