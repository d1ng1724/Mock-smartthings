server:
  port: ${PORT:8081}

mock:
  # 상태 갱신 주기(ms). 이 주기마다 run 중인 기기의 남은시간이 줄어든다.
  tick-ms: ${MOCK_TICK_MS:1000}
  # tick 한 번에 줄어드는 "분". 기본 1 → 60분 사이클이 60초 만에 끝난다(테스트용 가속).
  minutes-per-tick: ${MOCK_MINUTES_PER_TICK:1}
  # 완료(finish/finished) 상태를 유지하는 시간(초). 이후 jobState 가 none 으로 돌아간다.
  finish-hold-seconds: ${MOCK_FINISH_HOLD_SECONDS:30}
  # 명령을 받고 상태에 반영되기까지의 지연(ms). 실기기는 클라우드를 거쳐 몇 초 걸린다.
  # 0 이면 즉시 반영. 반영 시점은 tick 단위라 실제 지연은 tick-ms 만큼 더 길어질 수 있다.
  command-delay-ms: ${MOCK_COMMAND_DELAY_MS:0}
  # lenient: Authorization 헤더만 있으면 통과 / strict: 목이 발급한 토큰만 통과(만료되면 401)
  token-validation: ${MOCK_TOKEN_VALIDATION:lenient}
  oauth:
    # 발급 토큰 유효 시간(초). 짧게 주면 관리 프로그램의 갱신 스케줄러를 빨리 돌려볼 수 있다.
    expires-in-seconds: ${MOCK_OAUTH_EXPIRES_IN:3600}
    # true 면 모르는 refresh token 도 받아준다. 목이 재시작돼 토큰을 잃어버려도
    # 클라이언트의 갱신 스케줄러가 스스로 복구하므로, 사람이 없는 개발 서버에 유용하다.
    # false(기본)는 실제 OAuth 서버와 같이 400 invalid_grant 로 거절한다.
    accept-unknown-refresh: ${MOCK_OAUTH_ACCEPT_UNKNOWN_REFRESH:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 태그(SmartThings Devices → OAuth → Mock 조작 → Health)와 메서드 순으로 정렬
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  # 기기 API 는 /v1/devices 와 /devices 를 둘 다 받지만, 문서에는 /v1 쪽만 싣는다.
  paths-to-exclude: /devices, /devices/**
